<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>French Atelier | Performance Comparison</title><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#f5faff;font:22px/1.4 'Hanken Grotesk',sans-serif}main{max-width:1560px;padding:32px 44px 70px;margin:auto}header{font-size:26px;font-weight:700;padding-bottom:20px;border-bottom:1px solid #294158}nav{display:flex;gap:14px;padding:24px 0;position:sticky;top:0;background:#07111ef5;z-index:2}nav a{font-size:24px;color:white;text-decoration:none;padding:16px 25px;background:#1a3048;border-radius:10px}nav a.active{background:#62e5c1;color:#061822}h1,h2,.number{font-family:'Inter Tight',sans-serif}h1{font-size:clamp(42px,5vw,74px);letter-spacing:-.035em;line-height:1.06;margin:20px 0}h2{font-size:40px;line-height:1.12;margin:45px 0 18px}.period{font-size:28px;color:#a9cae7;margin:15px 0 25px}.notice{font-size:22px;background:#302719;color:#ffdda2;border-left:6px solid #ffc766;padding:18px 24px;margin:24px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer{background:#11263a;padding:25px;border-radius:15px}.answer strong{display:block;font-size:30px;line-height:1.2;margin:12px 0;color:#ffcf7b}.table-wrap{overflow:auto;background:#11263a;border-radius:15px}table{width:100%;border-collapse:collapse;font-size:24px}th,td{padding:19px 22px;border-bottom:1px solid #2a4157;text-align:right}th{background:#1b354e;color:#bedaff;font-size:21px}td:first-child,th:first-child{text-align:left}td:first-child{font-weight:700}td{font-variant-numeric:tabular-nums}td.value{font-size:32px;font-weight:700;color:#82c7ff}td.missing{font-size:21px;color:#ffd080}.red{color:#ff939c!important}.green{color:#67e8bf!important}.muted{color:#b9cbdd;font-size:20px}.group{font-size:27px;color:white;text-align:center!important}.total td{background:#1a344a;font-weight:700}.rep-table{min-width:1080px}.rep-table td{font-size:26px}.rep-table td.missing{font-size:20px}.rep-table th{font-size:20px}.footer{font-size:20px;margin-top:28px;color:#b9cbdd}.footer a{color:#82c7ff}section{margin:35px 0}.scope{font-size:21px;color:#b9cbdd}a:focus-visible{outline:3px solid #62e5c1;outline-offset:3px}@media(max-width:750px){main{padding:20px 16px}h1{font-size:46px}h2{font-size:34px}nav a{font-size:20px;padding:13px 18px}.answers{grid-template-columns:1fr}table{min-width:720px}.period{font-size:23px}th,td{padding:15px}td.value{font-size:27px}.notice{font-size:20px}}
</style></head><body><main><header>French Atelier · CEO performance comparison</header><nav><a id="weekly-link" href="#weekly">This week</a><a id="monthly-link" href="#monthly">This month</a></nav><div id="view"></div></main>
<script>
let D;const names=['Mokla Sara','Levite Eric','Azizi Malek','Levy Marc','Petit Anais','Mourabit Maryam'];const display={'Mokla Sara':'Sara','Levite Eric':'Eric','Azizi Malek':'Malek','Levy Marc':'Marc Levy','Petit Anais':'Anais','Mourabit Maryam':'Maryam'};const n=(x,d=0)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),pct=(x,y)=>n(100*x/y,1)+'%';
function render(){const month=location.hash==='#monthly',period=month?'This month':'This week';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.id===(month?'monthly-link':'weekly-link')));
const reps=names.map(name=>D['byRep-10.csv'].find(r=>r.EmployeeName===name));const t=D.totals['byRep-10.csv'],w=D.totals['ByWeekday.csv'];const sums=Object.fromEntries(['Calls','Cont','Acqs','Regs'].map(k=>[k,reps.reduce((a,r)=>a+r[k],0)]));
const rows=[['Calls',n(t.Calls),'Snapshot 10'],['Contacted',n(t.Cont),'Snapshot 10'],['Acquisitions',n(t.Acqs),'Snapshot 10'],['Registrations',n(t.Regs),'Snapshot 10'],['Acquisition / contacted',pct(t.Acqs,t.Cont),'Snapshot 10'],['Registration / contacted',pct(t.Regs,t.Cont),'Snapshot 10'],['Contacted / calls',pct(t.Cont,t.Calls),'Snapshot 10'],['Calls per shift','No shift data','Not calculable'],['Calls per lead',n(w.Calls/w.Leads,2),'3,406 calls / 570 leads; matched snapshot 9'],['Leads',n(w.Leads),'Matched snapshot 9'],['Contacted from leads',n(w['Cont from Lds']),'Matched snapshot 9'],['Contacted from leads / leads',pct(w['Cont from Lds'],w.Leads),'Matched snapshot 9'],['Acquisition / leads',pct(w.Acqs,w.Leads),'Matched snapshot 9']];
document.getElementById('view').innerHTML=`
<h1>${month?'Monthly':'Weekly'} performance comparison</h1><div class="period">${period} vs July + August 2026 · September excluded from baseline</div>
<div class="notice"><strong>Comparison not established:</strong> uploaded reports have no dates; July/August figures and shift counts were not recovered.</div>
<div class="answers"><div class="answer">Which reps caused the decline?<strong>Cannot determine versus their averages.</strong><span class="muted">Eric: 0 acquisitions / 63 contacts. Maryam: 0 / 31. Historical conversion rates are missing.</span></div><div class="answer">Did overall calling fall?<strong>Cannot determine versus July/August.</strong><span class="muted">Uploaded total: 3,424 calls. Calls per shift cannot be calculated without shifts.</span></div></div>
<section><h2>Overall call center: side by side</h2><div class="table-wrap"><table><thead><tr><th>Metric</th><th>${period}<br><span class="muted">Uploaded figures; period unverified</span></th><th>July + August<br>baseline</th><th>Change</th></tr></thead><tbody>${rows.map(([label,value,source])=>`<tr><td>${label}<div class="muted">${source}</div></td><td class="value">${value}</td><td class="missing">Not available</td><td class="missing">Not calculable</td></tr>`).join('')}</tbody></table></div></section>
<section><h2>Rep conversion: side by side</h2><div class="table-wrap"><table class="rep-table"><thead><tr><th rowspan="2">Rep</th><th colspan="4" class="group">Uploaded snapshot 10 · dates unverified</th><th colspan="2" class="group">July + August</th><th rowspan="2">Change in<br>conversion</th></tr><tr><th>Contacted</th><th>Acqs</th><th>Acq / contact</th><th>Regs</th><th>Own average<br>Acq / contact</th><th>Acq shortfall</th></tr></thead><tbody>${reps.map(r=>`<tr><td>${display[r.EmployeeName]}</td><td>${n(r.Cont)}</td><td class="${r.Acqs===0?'red':''}">${n(r.Acqs)}</td><td class="${r.Acqs===0?'red':'green'}">${pct(r.Acqs,r.Cont)}</td><td>${n(r.Regs)}</td><td class="missing">Not available</td><td class="missing">Not calculable</td><td class="missing">Not calculable</td></tr>`).join('')}<tr class="total"><td>These 6 reps</td><td>${n(sums.Cont)}</td><td>${n(sums.Acqs)}</td><td>${pct(sums.Acqs,sums.Cont)}</td><td>${n(sums.Regs)}</td><td class="missing">Not available</td><td class="missing">Not calculable</td><td class="missing">Not calculable</td></tr></tbody></table></div></section>
<section><h2>Rep calling: side by side</h2><div class="table-wrap"><table class="rep-table"><thead><tr><th>Rep</th><th>Uploaded<br>calls</th><th>Uploaded<br>contacted / calls</th><th>July/Aug<br>calls per shift</th><th>Current<br>calls per shift</th><th>Change</th></tr></thead><tbody>${reps.map(r=>`<tr><td>${display[r.EmployeeName]}</td><td>${n(r.Calls)}</td><td>${pct(r.Cont,r.Calls)}</td><td class="missing">Not available</td><td class="missing">No shift data</td><td class="missing">Not calculable</td></tr>`).join('')}<tr class="total"><td>These 6 reps</td><td>${n(sums.Calls)}</td><td>${pct(sums.Cont,sums.Calls)}</td><td class="missing">Not available</td><td class="missing">No shift data</td><td class="missing">Not calculable</td></tr></tbody></table></div></section>
<p class="scope">Rep scope: Sara, Eric, Malek, Marc Levy, Anais and Maryam only. Additional reps require verified sales above 2 in the past 60 days; that history was not recovered.</p>
<p class="footer">Overall totals include every report row; rep totals include only these six. Calls per lead uses the matched weekday report, not snapshot 10. <a href="sources/byRep-10.csv">Rep data</a> · <a href="sources/ByWeekday.csv">Call-center lead data</a></p>`;
}fetch('data.json').then(r=>r.json()).then(x=>{D=x;render()});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
</script></body></html>
