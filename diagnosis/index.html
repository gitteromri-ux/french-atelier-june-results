<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>French Atelier | Performance Diagnosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111e;--card:#102235;--ink:#f6fbff;--muted:#b6cadb;--red:#ff7e89;--green:#53e7bd;--amber:#ffd27d;--blue:#77bfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 'Hanken Grotesk',sans-serif}main,header{max-width:1500px;margin:auto;padding:28px 48px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #284155}header strong{font-size:25px}a{color:var(--blue)}nav{display:flex;gap:10px;position:sticky;top:0;z-index:3;background:#07111ef5;padding:18px 0}nav a{color:white;text-decoration:none;padding:14px 26px;border-radius:10px;background:#183044;font-size:22px;font-weight:700}nav a.active{background:var(--green);color:#07111e}h1,h2,h3,.value{font-family:'Inter Tight',sans-serif}h1{font-size:clamp(43px,5.7vw,88px);line-height:1.02;letter-spacing:-.045em;margin:25px 0}h2{font-size:clamp(32px,3.4vw,48px);line-height:1.12;margin:0 0 22px}h3{font-size:27px;margin:0 0 10px}p{margin:12px 0}.lead{font-size:25px;color:var(--muted);max-width:1000px}.warning{background:#352719;border-left:6px solid var(--amber);padding:22px 28px;border-radius:0 12px 12px 0;color:#ffe5ba;font-size:20px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:28px 0}.card{background:var(--card);padding:25px;border-radius:18px;box-shadow:0 15px 35px #0002}.card .label{color:var(--muted);font-size:20px}.value{font-size:clamp(40px,4.5vw,66px);font-weight:800;letter-spacing:-.035em;line-height:1.15;margin:12px 0}.red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:var(--blue)}.section{margin:60px 0}.split{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.feature{padding:36px;border-radius:20px;background:linear-gradient(125deg,#193b47,#102235)}.feature p{font-size:22px}.bar{height:20px;background:#263e50;border-radius:10px;margin:12px 0 20px;overflow:hidden}.bar i{display:block;background:var(--red);height:100%}.table-wrap{overflow:auto;background:var(--card);border-radius:18px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:20px}th,td{padding:18px;text-align:right;border-bottom:1px solid #284155}th{font-size:17px;color:var(--muted)}td:first-child,th:first-child{text-align:left}td:first-child{font-weight:700}.note{color:var(--muted);font-size:18px}.status{display:inline-block;color:var(--amber);font-size:18px;font-weight:700}.flow{display:flex;gap:20px;align-items:center;margin:25px 0}.flow>div{flex:1;background:var(--card);border-radius:14px;padding:25px}.flow strong{display:block;font-size:46px;color:var(--blue)}details{background:var(--card);padding:24px;border-radius:16px;margin:18px 0}summary{cursor:pointer;font-size:23px;font-weight:700}footer{border-top:1px solid #284155;margin-top:55px;padding:30px 0;color:var(--muted)}button{font:inherit}.metric-list{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric-list>div{background:var(--card);padding:25px;border-radius:15px}.big-line{font-size:30px;font-weight:700}.source-links{display:flex;gap:22px;flex-wrap:wrap}a:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:5px}@media(max-width:800px){header,main{padding:20px}header{display:block}header span{display:block}.grid{grid-template-columns:1fr 1fr}.split,.metric-list{grid-template-columns:1fr}nav a{font-size:18px;padding:12px 16px}.flow{flex-direction:column;align-items:stretch}.value{font-size:42px}.feature{padding:25px}h1{font-size:48px}table{font-size:18px}}@media print{nav{position:static}body{background:white;color:#111}.card,.feature,.table-wrap,.flow>div{background:#edf3f8;color:#111}}
</style></head><body><header><strong>French Atelier</strong><span>CEO performance diagnosis · 22 September 2026</span></header>
<main><nav aria-label="Diagnosis views"><a href="#weekly" id="weekly-link">This week</a><a href="#monthly" id="monthly-link">This month</a></nav><div id="view" aria-live="polite">Loading verified report figures...</div><footer>Calculated from your three uploaded CSVs. No invented dates, shifts, spending or historical rep averages.<div class="source-links"><a href="sources/byRep-9.csv">Rep snapshot 9</a><a href="sources/byRep-10.csv">Rep snapshot 10</a><a href="sources/ByWeekday.csv">Weekday report</a></div></footer></main>
<script>
let D;const n=(v,d=0)=>Number(v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}),p=(a,b)=>n(100*a/b,1)+'%';
const card=(label,value,note,color='')=>`<div class="card"><div class="label">${label}</div><div class="value ${color}">${value}</div><div>${note}</div></div>`;
function render(){
const monthly=location.hash==='#monthly';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.id===(monthly?'monthly-link':'weekly-link')));
const reps=D['byRep-10.csv'],t=D.totals['byRep-10.csv'],w=D.totals['ByWeekday.csv'];
const zero=reps.filter(r=>r.Calls>=100&&r.Acqs===0),zc=zero.reduce((a,r)=>a+r.Calls,0),zco=zero.reduce((a,r)=>a+r.Cont,0);
document.getElementById('view').innerHTML=`
<span class="status">${monthly?'Monthly':'Weekly'} comparison status: historical baseline not verified</span>
<h1>${monthly?'Month-on-month blame<br>is not established.':'Three active reps.<br><span class="red">Zero acquisitions.</span>'}</h1>
<p class="lead">${monthly?'The supplied snapshot identifies execution risks, but it cannot prove who deteriorated versus July and August.':'Eric, Maryam and Jerome account for '+p(zc,t.Calls)+' of reported calls and '+p(zco,t.Cont)+' of contacts in snapshot 10, with no acquisitions.'}</p>
<div class="warning"><strong>Date gate:</strong> None of the CSVs contains a date range; the figures below are undated snapshots, not verified week-to-date or month-to-date totals. Required baseline: 1 July to 31 August 2026, excluding all of September.</div>
${monthly?`<div class="metric-list"><div><h3>Calls per shift this month</h3><div class="big-line amber">Not calculable</div><p>No September shift count or dated monthly calls supplied.</p></div><div><h3>Prior two-month calls per shift</h3><div class="big-line amber">Not calculable</div><p>Needs July + August calls divided by July + August shifts.</p></div><div><h3>Calls per lead this month</h3><div class="big-line amber">Not date-verifiable</div><p>The matched undated snapshot is <strong>${n(w.Calls/w.Leads,2)}</strong> calls per lead; it is not a confirmed September figure.</p></div><div><h3>Prior two-month calls per lead</h3><div class="big-line amber">Baseline not recovered</div><p>Needs July + August calls divided by July + August leads.</p></div></div>`:''}
<div class="grid">${card('Calls',n(t.Calls),'Snapshot 10, latest numbered export','blue')}${card('Contacted',n(t.Cont),'CRM Cont total; not new leads','blue')}${card('Acquisitions',n(t.Acqs),p(t.Acqs,t.Cont)+' of contacts','red')}${card('Registrations',n(t.Regs),p(t.Regs,t.Cont)+' of contacts','green')}</div>
<section class="section split"><div class="feature"><h2>The operational risk is concentrated.</h2><div class="value red">${n(zc)}</div><p>Calls by Eric, Maryam and Jerome produced <strong>${n(zco)} contacts, 6 registrations and 0 acquisitions.</strong></p><div class="bar"><i style="width:${100*zc/t.Calls}%"></i></div><p>${p(zc,t.Calls)} of team call volume; ${p(zco,t.Cont)} of team contacted volume.</p></div><div class="feature"><h2>Do not confuse a risk with proof of decline.</h2><p><strong>Conversion concern:</strong> Eric has 63 contacts and zero acquisitions; Maryam has 31; Jerome has 11.</p><p><strong>Contact-efficiency concern:</strong> Maryam and Anais yield fewer than 5 contacts per 100 calls.</p><p><strong>Not yet proven:</strong> a fall against each rep's own average, reduced staffing, weaker leads or a spending change.</p></div></section>
<section class="section"><h2>Who needs attention, and why?</h2><p class="lead">Actual output is measurable. Individual deterioration is not measurable without each rep's July/August history.</p><div class="table-wrap"><table><thead><tr><th>Representative</th><th>Calls</th><th>Contacted</th><th>Contact / call</th><th>Acqs</th><th>Acq / contact</th><th>Regs</th><th>Vs own baseline</th></tr></thead><tbody>${reps.filter(r=>r.Calls>=100).sort((a,b)=>a.Acqs-b.Acqs||b.Cont-a.Cont).map(r=>`<tr><td>${r.EmployeeName}</td><td>${n(r.Calls)}</td><td>${n(r.Cont)}</td><td class="${r.Cont/r.Calls<.05?'amber':''}">${p(r.Cont,r.Calls)}</td><td class="${r.Acqs===0?'red':'green'}">${n(r.Acqs)}</td><td class="${r.Acqs===0?'red':''}">${p(r.Acqs,r.Cont)}</td><td>${n(r.Regs)}</td><td class="amber">Unverified</td></tr>`).join('')}</tbody></table></div><p class="note">Seven reps with at least 100 calls shown; all 17 rows included in team totals. Blank activity cells count as zero for aggregation, not as proof of attendance or absence.</p></section>
<section class="section"><h2>The matched lead funnel.</h2><p class="lead">Use ByWeekday with snapshot 9 only: both reconcile exactly on calls, contacts, acquisitions, registrations and retries.</p><div class="flow"><div>Incoming leads<strong>${n(w.Leads)}</strong></div><div>Contacted from leads<strong>${n(w['Cont from Lds'])}</strong>${p(w['Cont from Lds'],w.Leads)} of leads</div><div>Acquisitions<strong>${n(w.Acqs)}</strong>${p(w.Acqs,w.Leads)} of leads</div></div><div class="grid">${card('Calls per lead',n(w.Calls/w.Leads,2),'3,406 calls / 570 leads','blue')}${card('Contacted total',n(w.Cont),'Different from 195 contacted from leads','blue')}${card('Acq / contacted',p(w.Acqs,w.Cont),'14 acquisitions / 271 contacts','red')}${card('Reg / contacted',p(w.Regs,w.Cont),'27 registrations / 271 contacts','green')}</div><p class="note">This is a reporting-period ratio, not a tracked lead-cohort conversion funnel: contacts and sales may include older leads.</p></section>
<section class="section"><h2>High call volume alone is not enough.</h2><div class="table-wrap"><table><thead><tr><th>Weekday bucket</th><th>Calls</th><th>Leads</th><th>Calls / lead</th><th>Contacted</th><th>Acqs</th><th>Acq / contact</th></tr></thead><tbody>${D['ByWeekday.csv'].sort((a,b)=>b.Calls-a.Calls).map(r=>`<tr><td>${r.Weekday}</td><td>${n(r.Calls)}</td><td>${n(r.Leads)}</td><td>${n(r.Calls/r.Leads,2)}</td><td>${n(r.Cont)}</td><td>${n(r.Acqs)}</td><td>${p(r.Acqs,r.Cont)}</td></tr>`).join('')}</tbody></table></div><p class="note">Monday has 1,174 calls and 1 acquisition; its 1.3% acquisition/contact ratio warrants review, but weekday buckets cannot establish a specific week's trend.</p></section>
<section class="section"><h2>What the CEO can conclude today.</h2><div class="split"><div class="feature"><h3 class="green">Supported by the uploads</h3><p>Review Eric's 63, Maryam's 31 and Jerome's 11 contacted cases with no acquisitions.</p><p>Audit contactability and routing for Maryam and Anais before simply demanding more calls.</p><p>Keep acquisition and registration KPIs separate: zero acquisitions does not mean zero registrations.</p></div><div class="feature"><h3 class="amber">Not supported by the uploads</h3><p>Which rep caused the weekly or monthly decline versus their own average.</p><p>Whether calls per shift fell, spending efficiency deteriorated or lead volume dropped.</p><p>Whether September is worse than July/August after matching elapsed days and lead maturity.</p></div></div></section>
<details><summary>Comparison rules and source reconciliation</summary><p><strong>Two distinct exports, not two months:</strong> snapshot 10 differs from snapshot 9 by +18 calls, +5 contacts, +1 registration, +47 retries and zero acquisitions; their overlap must not be added together.</p><p><strong>Calls per lead:</strong> 3,406 / 570 = ${n(3406/570,4)} using matched snapshot 9 and ByWeekday; snapshot 10 has no matching lead count.</p><p><strong>Calls per shift:</strong> total calls / actual worked shifts, not retries, weekdays or employee counts.</p><p><strong>Baseline ratios:</strong> pooled July + August numerators divided by pooled denominators, not the average of rep percentages.</p><p><strong>Rep attribution once history is available:</strong> actual acquisitions minus current contacts × each rep's pooled historical acquisition/contact rate; this is an accounting shortfall, not causal proof.</p><p><strong>Fair time windows:</strong> compare weekly totals to baseline per-day output over the same number of elapsed weekdays; compare September-to-date to matched July/August elapsed days, alongside full-month pooled rates.</p><p><strong>Missing fields:</strong> dated weekly and monthly reports, July/August rep history, worked shifts, and spending. No inferred or zero-filled historical baseline is used.</p></details>`;
}fetch('data.json').then(r=>r.json()).then(x=>{D=x;render()});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
</script></body></html>
